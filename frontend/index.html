<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Parser - Frontend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DB Parser</h1>
            <p class="subtitle">Frontend Application</p>
        </header>

        <section class="status-section">
            <h2>Server Status</h2>
            <div id="status" class="status-box">
                <p>Click the button to check server status</p>
            </div>
            <button id="checkStatusBtn" class="btn">Check Server Status</button>
        </section>

        <section class="data-section">
            <h2>Sample Data</h2>
            <div id="data" class="data-box">
                <p>Click the button to fetch data from the server</p>
            </div>
            <button id="fetchDataBtn" class="btn">Fetch Data</button>
        </section>

        <section class="api-section">
            <h2>API Information</h2>
            <div id="api-info" class="info-box">
                <p>Click the button to get API information</p>
            </div>
            <button id="getApiInfoBtn" class="btn">Get API Info</button>
        </section>

        <footer>
            <p>&copy; 2026 DB Parser. Built with HTML, CSS, and JavaScript.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
